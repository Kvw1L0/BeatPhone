<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking BATIPHONE</title>
<!-- Cambio a estética retro / Pixel Art -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* ================= CONFIGURACIÓN VISUAL ================= */
  :root {
    --brand-color:  #00b2ed; 
    --dark-bg: #011449;
    --text-glow: 0 0 15px #006ab9;
  }

  body {
    background-color: var(--dark-bg);
    background-image: url("fondo.png");
    background-size: cover;
    background-position: center;
    color: white;
    font-family: 'Press Start 2P', cursive;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.85); 
    z-index: -1;
  }

  /* ================= ESTILOS BASE ================= */
  
  h1 {
    font-size: 1.5rem; 
    margin: 25px 0 20px 0;
    text-transform: uppercase;
    color: var(--brand-color);
    text-shadow: 4px 4px 0px #000;
    line-height: 1.5;
    text-align: center;
  }

  .container {
    width: 95%; 
    max-width: 1000px;
    background: rgba(10, 10, 10, 0.8);
    border: 4px solid var(--brand-color); 
    border-radius: 12px; /* Borde redondeado normal */
    padding: 15px 10px; 
    box-shadow: 0 0 15px rgba(252, 238, 9, 0.3), inset 0 0 10px rgba(252, 238, 9, 0.1);
    backdrop-filter: blur(5px);
    overflow: hidden; 
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    font-size: 0.7rem; 
    border-bottom: 2px solid var(--brand-color);
    color: var(--brand-color);
    text-transform: uppercase;
  }

  #ranking-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .rank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    font-size: 0.8rem; 
    border-bottom: 1px solid --brand-color;
    animation: fadeIn 0.5s ease-out;
  }

  /* Colores para el Top 3 */
  .rank-item:nth-child(1) { color: var(--brand-color); font-size: 1.1rem; text-shadow: var(--text-glow); }
  .rank-item:nth-child(2) { color: #E0E0E0; font-size: 0.95rem; text-shadow: 0 0 10px rgba(255,255,255,0.4); } 
  .rank-item:nth-child(3) { color: #CD7F32; font-size: 0.85rem; } 

  .rank-pos { width: 40px; text-align: center; }
  .rank-name { 
    flex-grow: 1; 
    text-align: left; 
    padding-left: 15px; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .rank-time { color: var(--brand-color); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loading {
    text-align: center; font-size: 0.9rem; padding: 30px; line-height: 1.5;
    color: var(--brand-color); opacity: 0.7; text-transform: uppercase;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

  /* ================= ADAPTACIÓN PARA PANTALLA GIGANTE ================= */
  @media (min-width: 768px) {
    h1 {
      font-size: 3rem; /* Ajustado para fuente pixel */
      margin: 40px 0 30px 0;
    }
    .container {
      width: 85%;
      padding: 30px;
      border: 6px solid var(--brand-color);
    }
    .header-row {
      font-size: 1.2rem;
      padding: 20px 30px;
      border-bottom: 4px solid var(--brand-color);
    }
    .rank-item {
      font-size: 1.2rem;
      padding: 20px 30px;
    }
    .rank-pos { width: 60px; }
    .rank-name { padding-left: 30px; }
    
    .rank-item:nth-child(1) { font-size: 1.8rem; }
    .rank-item:nth-child(2) { font-size: 1.5rem; }
    .rank-item:nth-child(3) { font-size: 1.3rem; }
    
    .loading { font-size: 1.5rem; padding: 50px; }
  }

</style>
</head>
<body>

<div class="overlay"></div>

<h1>🏆 RANKING 🏆 </h1>

<div class="container">
  <div class="header-row">
    <span class="rank-pos">#</span>
    <span class="rank-name">Jugador</span>
    <span class="rank-time">Tiempo</span>
  </div>
  
  <ul id="ranking-list">
    <div class="loading">Cargando<br><br>puntajes...</div>
  </ul>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyViG0_MaktcyCywQJ1BMhx6arnVndR3qYK4gPiYU7X8lAwEs0ZfDnq5yvV7oEAI7qktg/exec";
  let lastDataString = ""; 

  async function updateRanking() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();

      const top10Data = data.slice(0, 10);
      const newDataString = JSON.stringify(top10Data);

      if (newDataString === lastDataString) return;
      lastDataString = newDataString;

      const list = document.getElementById("ranking-list");
      list.innerHTML = ""; 

      top10Data.forEach((player, index) => {
        const li = document.createElement("li");
        li.className = "rank-item";
        
        let icon = "";
        if (index === 0) icon = "👑 ";
        else if (index === 1) icon = "🥈 ";
        else if (index === 2) icon = "🥉 ";

        li.innerHTML = `
          <span class="rank-pos">${index + 1}</span>
          <span class="rank-name">${icon}${player.name}</span>
          <span class="rank-time">${player.time.toFixed(2)}s</span>
        `;
        list.appendChild(li);
      });

    } catch (error) {
      console.error("Error cargando ranking:", error);
    }
  }

  updateRanking();
  setInterval(updateRanking, 5000);

</script>

</body>
</html>
