<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desafío Jungle - Santander Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-color: #FF0000; 
            --dark-bg: rgba(15, 15, 15, 0.95);
            --bg-image: url('fondo.png'); 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            background-color: #000; background-image: var(--bg-image);
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        .screen {
            position: fixed; inset: 0; 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: opacity 0.4s ease, transform 0.4s ease;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); position: absolute; z-index: -1; }

        /* --- TICKET FORMULARIO --- */
        .ticket-panel {
            background-image: url('ticket.png'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            width: 100vw; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 32vh 10% 5vh 10%; 
            text-align: center; 
            position: relative;
            background-color: #1a1a1a;
        }

        /* --- PANELES TRADICIONALES --- */
        .panel {
            background: var(--dark-bg);
            border: 2px solid var(--brand-color); 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 0, 0, 0.3);
            padding: 30px 25px; 
            width: 90%; 
            max-width: 400px;
            text-align: center; 
            position: relative;
        }

        h2 { color: var(--brand-color); font-size: 1.6rem; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; text-shadow: 1px 1px 0px #000; }

        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { color: #fff; font-size: 0.85rem; margin-bottom: 5px; display: block; font-weight: bold; text-shadow: 1px 1px 2px #000;}

        input {
            width: 100%; padding: 12px 14px; font-size: 1rem;
            background: rgba(25, 25, 25, 0.95); color: #fff;
            border: 1px solid #444; border-radius: 8px; 
            font-family: 'Montserrat', sans-serif; font-weight: bold; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: var(--brand-color); background: #000; }

        /* --- BOTONES MODERNOS --- */
        button {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: 800;
            background: var(--brand-color); color: #fff; 
            border: none; border-radius: 10px; 
            cursor: pointer; text-transform: uppercase; margin-top: 15px;
            box-shadow: 0 4px 0px #990000; transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0px 0px #990000; }

        .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #444; box-shadow: 0 4px 0px #000; }
        .btn-secondary:active { box-shadow: 0 0px 0px #000; }
        .btn-half { width: 48%; display: inline-block; font-size: 1rem; padding: 15px 5px;}

        /* --- VIDEOS --- */
        video { width: 100vw; height: 100vh; object-fit: cover; background: #000; }

        /* --- JUEGO E IMÁGENES --- */
        .game-wrapper { position: relative; width: 100vw; height: 100vh; display: none; z-index: 10; background-color: #000; }
        .base-img, .full-img, .street-img, #reveal-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        .base-img { z-index: 1; }
        #reveal-canvas { z-index: 2; }
        .full-img { opacity: 0; transition: opacity 1s ease; z-index: 3; }
        .street-img { opacity: 0; transition: opacity 2s ease; z-index: 4; }

        .big-text { font-size: 3.5rem; margin: 5px 0 15px 0; font-weight: 900; color: var(--brand-color); }
        #countdown-text { font-size: 8rem; font-weight: 900; color: var(--brand-color); text-shadow: 5px 5px 0px #000; animation: pop 1s infinite; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }

        /* --- DISEÑO DE TABLAS DE RANKING --- */
        .ranking-table { 
            width: 100%; color: white; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem;
            background: #111; border-radius: 8px; overflow: hidden; border: 1px solid #333;
        }
        .ranking-table th { background-color: var(--brand-color); color: #fff; padding: 12px 10px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;}
        .ranking-table td { padding: 12px 10px; border-bottom: 1px solid #222; }
        .ranking-table tr:last-child td { border-bottom: none; }
        .ranking-table tr:nth-child(even) td { background-color: rgba(255,255,255,0.03); } 
        .rank-highlight td { background: rgba(255, 0, 0, 0.25); font-weight: 900; color: #fff;}
        
        .instruction-item { display: flex; align-items: center; text-align: left; margin-bottom: 25px; color: #ddd; font-size: 0.95rem; line-height: 1.4; }
        .instruction-icon { font-size: 2rem; margin-right: 15px; background: #222; border-radius: 12px; padding: 12px; border: 1px solid #444; }
    </style>
</head>
<body>

    <!-- MÚSICA DE FONDO -->
    <audio id="bg-audio" loop preload="auto">
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <!-- FORMULARIO TICKET -->
    <div id="screen-ticket" class="screen">
        <div class="ticket-panel">
            <div class="form-group"><label>Nombre y Apellido:</label><input type="text" id="f-nombre" placeholder="Ej: Juan Pérez"></div>
            <div class="form-group"><label>Región:</label><input type="text" id="f-region" placeholder="Ej: Metropolitana"></div>
            <div class="form-group"><label>Sucursal:</label><input type="text" id="f-sucursal" placeholder="Ej: Las Condes"></div>
            <div class="form-group"><label>E-mail:</label><input type="email" id="f-email" placeholder="Ej: juan@correo.com"></div>
            <button id="btn-submit-ticket" style="margin-top: auto; margin-bottom: 10vh;">INGRESAR</button>
        </div>
    </div>

    <!-- VIDEO 1 -->
    <div id="screen-video1" class="screen hidden" style="padding:0; background:#000;">
        <video id="vid1" playsinline preload="auto">
            <source src="video1.mp4" type="video/mp4">
        </video>
    </div>

    <!-- MODAL DESAFÍO (CON NOMBRE PERSONALIZADO) -->
    <div id="screen-challenge" class="screen hidden">
        <div class="panel">
            <h2 id="modal-challenge-title">¿Aceptas el desafío?</h2>
            <p style="color: #ddd; margin-bottom: 25px; font-size: 1rem;">Prepárate para iluminar la Arena con tu energía.</p>
            <div style="display: flex; justify-content: space-between;">
                <button id="btn-yes" class="btn-half">SÍ, ACEPTO</button>
                <button id="btn-no" class="btn-half btn-secondary" onclick="location.reload()">NO</button>
            </div>
        </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div id="screen-instructions" class="screen hidden">
        <div class="panel">
            <h2>Cómo Jugar</h2>
            <div class="instruction-item">
                <div class="instruction-icon">📱</div>
                <div>Agita tu celular rápidamente para encender las luces, estrictamente desde la base hasta la cúpula.</div>
            </div>
            <button id="btn-start">¡LISTO, VAMOS!</button>
        </div>
    </div>

    <div id="screen-countdown" class="screen hidden" style="background: rgba(0,0,0,0.9);">
        <div id="countdown-text">3</div>
    </div>

    <!-- EL JUEGO (CAPAS DE IMÁGENES) -->
    <div id="game-container" class="game-wrapper">
        <img src="imagen1.png" class="base-img" alt="Arena Oscura">
        <canvas id="reveal-canvas"></canvas>
        <img src="imagen2.png" id="full-image" class="full-img" alt="Arena Iluminada">
        <img src="imagen3.png" id="street-image" class="street-img" alt="Calles Iluminadas">
    </div>

    <!-- VIDEO 2 -->
    <div id="screen-video2" class="screen hidden" style="padding:0; background:#000;">
        <video id="vid2" playsinline preload="auto">
            <source src="video2.mp4" type="video/mp4">
        </video>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="screen-result" class="screen hidden">
        <div class="panel">
            <h2>¡Arena Encendida!</h2>
            <p style="color: #bbb; margin:0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Tu tiempo fue:</p>
            <p class="big-text" id="final-time">0.00s</p>
            <div style="background: rgba(255, 0, 0, 0.1); border: 1px solid var(--brand-color); border-radius: 8px; padding: 12px; margin: 15px 0 20px 0;">
                <p id="rank-text" style="color: #fff; font-size: 1rem; font-weight: bold; margin: 0;">Calculando posición...</p>
            </div>
            <button id="btn-show-top15" class="btn-secondary">🏆 VER TOP 15</button>
            <button id="btn-show-zone" class="btn-secondary">🎯 VER MI ZONA</button>
            <button onclick="location.reload()" style="margin-top: 25px;">JUGAR DE NUEVO</button>
        </div>
    </div>

    <!-- MODALES RANKING -->
    <div id="modal-top15" class="screen hidden">
        <div class="panel" style="max-height: 85vh; display: flex; flex-direction: column;">
            <h2>Top 15 Global</h2>
            <div style="overflow-y: auto; flex-grow: 1; border-radius: 8px; margin-bottom: 15px;">
                <table class="ranking-table" id="table-top15"></table>
            </div>
            <button onclick="document.getElementById('modal-top15').classList.add('hidden')">VOLVER</button>
        </div>
    </div>
    <div id="modal-zone" class="screen hidden">
        <div class="panel">
            <h2>Tu Zona de Ranking</h2>
            <table class="ranking-table" id="table-zone" style="margin-bottom: 20px;"></table>
            <button onclick="document.getElementById('modal-zone').classList.add('hidden')">VOLVER</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        (function() {
            const CONFIG = {
                webhookUrl: "https://script.google.com/macros/s/AKfycbyViG0_MaktcyCywQJ1BMhx6arnVndR3qYK4gPiYU7X8lAwEs0ZfDnq5yvV7oEAI7qktg/exec", 
                threshold: 8, // PUNTO 1: Umbral reducido de 12 a 8 para reacción casi instantánea
                numRows: 35 
            };

            const AudioEngine = {
                ctx: null,
                init: function() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
                playTone: function(freq, type, duration, vol=0.1) {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                },
                beep: function() { this.playTone(440, 'square', 0.2, 0.1); }, 
                go: function() { this.playTone(880, 'square', 0.4, 0.2); },   
                tick: function() { this.playTone(900, 'sine', 0.02, 0.01); }, 
                win: function() { 
                    this.playTone(440, 'sine', 0.5); 
                    setTimeout(() => this.playTone(554, 'sine', 0.5), 100); 
                    setTimeout(() => this.playTone(659, 'sine', 1.0), 200); 
                }
            };

            let state = { active: false, blinking: false, beats: 0, targetBeats: 0, start: 0, lastBeatTime: 0, formData: {} };
            let allLights = []; 
            let activeLights = []; 
            let animationFrameId = null;

            const ui = {
                bgAudio: document.getElementById("bg-audio"),
                scrTicket: document.getElementById("screen-ticket"),
                scrVid1: document.getElementById("screen-video1"),
                scrChallenge: document.getElementById("screen-challenge"),
                challengeTitle: document.getElementById("modal-challenge-title"), 
                scrInst: document.getElementById("screen-instructions"),
                scrCount: document.getElementById("screen-countdown"),
                gameContainer: document.getElementById("game-container"),
                scrVid2: document.getElementById("screen-video2"),
                scrResult: document.getElementById("screen-result"),
                revealCanvas: document.getElementById("reveal-canvas"),
                fullImage: document.getElementById("full-image"),
                streetImage: document.getElementById("street-image"),
                vid1: document.getElementById("vid1"),
                vid2: document.getElementById("vid2")
            };
            const ctx = ui.revealCanvas.getContext("2d");

            // --- FLUJO INICIAL ---
            document.getElementById("btn-submit-ticket").onclick = () => {
                state.formData = {
                    nombre: document.getElementById("f-nombre").value.trim(),
                    email: document.getElementById("f-email").value.trim()
                };
                if(!state.formData.nombre || !state.formData.email) return alert("Llena Nombre y E-mail para continuar.");
                
                const primerNombre = state.formData.nombre.split(' ')[0];
                ui.challengeTitle.innerText = `¿${primerNombre}, Aceptas el desafío?`;

                // INICIAR AUDIO DE FONDO
                ui.bgAudio.volume = 0.4; 
                ui.bgAudio.play().catch(e => console.log("Autoplay de audio bloqueado: ", e));
                
                AudioEngine.init();
                ui.scrTicket.classList.add("hidden");
                
                ui.scrVid1.classList.remove("hidden");
                ui.vid1.play().catch(() => ui.vid1.dispatchEvent(new Event('ended'))); 
            };

            ui.vid1.onended = () => {
                ui.scrVid1.classList.add("hidden");
                ui.scrChallenge.classList.remove("hidden");
            };

            document.getElementById("btn-yes").onclick = async () => {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try { await DeviceMotionEvent.requestPermission(); } catch (e) { }
                }
                ui.scrChallenge.classList.add("hidden");
                ui.scrInst.classList.remove("hidden");
            };

            document.getElementById("btn-start").onclick = () => {
                ui.scrInst.classList.add("hidden");
                startCountdown();
            };

            function getImageBounds(canvasW, canvasH, imgW, imgH) {
                let imgRatio = imgW / imgH; let canvasRatio = canvasW / canvasH;
                if (imgRatio > canvasRatio) return { x: 0, y: (canvasH - (canvasW/imgRatio))/2, w: canvasW, h: canvasW/imgRatio };
                return { x: (canvasW - (canvasH*imgRatio))/2, y: 0, w: canvasH*imgRatio, h: canvasH };
            }

            function startCountdown() {
                ui.scrCount.classList.remove("hidden");
                let count = 3; document.getElementById("countdown-text").innerText = count; AudioEngine.beep();
                const interval = setInterval(() => {
                    count--;
                    if (count > 0) { document.getElementById("countdown-text").innerText = count; AudioEngine.beep(); } 
                    else if (count === 0) {
                        document.getElementById("countdown-text").innerText = "¡AGITA!";
                        document.getElementById("countdown-text").style.fontSize = "5rem"; AudioEngine.go();
                        if(navigator.vibrate) navigator.vibrate(500); 
                    } else {
                        clearInterval(interval);
                        ui.scrCount.classList.add("hidden");
                        ui.gameContainer.style.display = "block";
                        setTimeout(startGame, 50);
                    }
                }, 1000);
            }

            // --- LÓGICA ESTRICTA DE LA CÚPULA 3D ---
            function startGame() {
                state.active = true; state.blinking = false; state.start = Date.now(); state.beats = 0;
                ui.revealCanvas.width = window.innerWidth; ui.revealCanvas.height = window.innerHeight;
                ui.fullImage.style.opacity = 0;
                ui.streetImage.style.opacity = 0;

                const bounds = getImageBounds(window.innerWidth, window.innerHeight, ui.fullImage.naturalWidth, ui.fullImage.naturalHeight);
                allLights = []; activeLights = [];
                
                const yStart = bounds.y + bounds.h * 0.82; 
                const yEnd = bounds.y + bounds.h * 0.45;   

                let rowWidths = [];
                let totalWidth = 0;

                for (let r = 0; r < CONFIG.numRows; r++) {
                    let progress = r / (CONFIG.numRows - 1); 
                    let w;
                    if (progress < 0.15) { w = 0.96; } 
                    else {
                        let d = (progress - 0.15) / 0.85;
                        w = 0.92 * Math.sqrt(1 - d * d); 
                    }
                    rowWidths.push(w);
                    totalWidth += w;
                }

                for (let r = 0; r < CONFIG.numRows; r++) {
                    let progress = r / (CONFIG.numRows - 1);
                    let yPos = yStart - (yStart - yEnd) * progress;
                    
                    let count = Math.floor((rowWidths[r] / totalWidth) * 600);
                    if (count === 0) count = 1; 

                    let rowW_px = rowWidths[r] * bounds.w;
                    let startX = bounds.x + bounds.w / 2 - rowW_px / 2;
                    let step = rowW_px / count;

                    let rowLights = [];
                    for (let c = 0; c < count; c++) {
                        let xPos = startX + step * c + step / 2;
                        xPos += (Math.random() * 6 - 3); 
                        let isPlatform = progress < 0.15;
                        let radius = isPlatform ? (Math.random() * 6 + 18) : (Math.random() * 4 + 7); 
                        // PUNTO 2: Inicializan en 0 (totalmente apagadas), pero se encenderán rápido al entrar
                        rowLights.push({ x: xPos, y: yPos, radius: radius, alpha: 0 }); 
                    }
                    
                    rowLights.sort(() => Math.random() - 0.5); 
                    allLights = allLights.concat(rowLights);
                }

                state.targetBeats = allLights.length; 
                
                window.addEventListener("devicemotion", handleMotion);
                ui.gameContainer.addEventListener("click", handleTap); 
                animationFrameId = requestAnimationFrame(renderLoop);
            }

            const handleMotion = (e) => {
                if (!state.active) return;
                const acc = e.acceleration;
                const force = Math.abs(acc.x||0) + Math.abs(acc.y||0) + Math.abs(acc.z||0);
                if (force > CONFIG.threshold) addBeat(2);
            };

            const handleTap = () => {
                if (!state.active) return;
                if(Date.now() - state.lastBeatTime < 50) return; 
                state.lastBeatTime = Date.now(); 
                addBeat(5); 
            };

            const addBeat = (amount) => {
                for(let i=0; i<amount; i++) {
                    if (activeLights.length < allLights.length) {
                        activeLights.push(allLights[activeLights.length]); 
                        AudioEngine.tick(); 
                        if(navigator.vibrate) navigator.vibrate(10);
                    }
                }

                if (activeLights.length >= state.targetBeats && !state.blinking) {
                    startEndSequence();
                }
            };

            function startEndSequence() {
                state.active = false; 
                state.blinking = true; 
                const totalTime = ((Date.now() - state.start) / 1000).toFixed(2);
                AudioEngine.win();
                if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]); 

                setTimeout(() => { ui.fullImage.style.opacity = 1; }, 200);
                setTimeout(() => { ui.streetImage.style.opacity = 1; }, 1200);

                setTimeout(() => {
                    state.blinking = false;
                    ui.gameContainer.style.display = "none";
                    launchVideo2(totalTime);
                }, 4000);
            }

            function renderLoop() {
                if (!state.active && !state.blinking) return;

                ctx.clearRect(0, 0, ui.revealCanvas.width, ui.revealCanvas.height);
                ctx.globalCompositeOperation = 'source-over';
                
                let globalAlphaMod = 1;
                if (state.blinking) {
                    globalAlphaMod = 0.3 + (Math.sin(Date.now() / 120) + 1) / 2 * 0.7; 
                }

                activeLights.forEach(light => {
                    // PUNTO 2: Transición rápida para que nazcan de la oscuridad total sin demoras
                    if (!state.blinking && light.alpha < 1) light.alpha += 0.25; 
                    
                    const finalAlpha = light.alpha * globalAlphaMod; 
                    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.radius);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${finalAlpha})`);
                    grad.addColorStop(1, `rgba(255, 255, 255, 0)`); 
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(light.x, light.y, light.radius, 0, Math.PI * 2); ctx.fill();
                });

                ctx.globalCompositeOperation = 'source-in';
                const bounds = getImageBounds(ui.revealCanvas.width, ui.revealCanvas.height, ui.fullImage.naturalWidth, ui.fullImage.naturalHeight);
                ctx.drawImage(ui.fullImage, bounds.x, bounds.y, bounds.w, bounds.h);

                animationFrameId = requestAnimationFrame(renderLoop);
            }

            function launchVideo2(timeString) {
                ui.bgAudio.pause();

                ui.scrVid2.classList.remove("hidden");
                ui.vid2.play().catch(() => ui.vid2.dispatchEvent(new Event('ended')));
                
                ui.vid2.onended = () => {
                    ui.scrVid2.classList.add("hidden");
                    showFinalResults(timeString);
                };
            }

            function showFinalResults(time) {
                document.getElementById("final-time").innerText = `${time}s`;
                ui.scrResult.classList.remove("hidden");
                const myConfetti = confetti.create(document.getElementById('confetti-canvas'), { resize: true });
                myConfetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#FF0000', '#000000', '#ffffff'] });
                
                const payload = { ...state.formData, time: parseFloat(time), v: btoa(state.formData.nombre + time) };
                fetch(CONFIG.webhookUrl, { method: "POST", body: JSON.stringify(payload) }).catch(()=>{});
                generateMockRankings(time);
            }

            function generateMockRankings(myTime) {
                const topTable = document.getElementById("table-top15");
                const zoneTable = document.getElementById("table-zone");
                topTable.innerHTML = "<tr><th>#</th><th>Nombre</th><th>Tiempo</th></tr>";
                zoneTable.innerHTML = "<tr><th>#</th><th>Nombre</th><th>Tiempo</th></tr>";

                for(let i=1; i<=15; i++) {
                    topTable.innerHTML += `<tr><td>${i}</td><td>Jugador ${i}</td><td>${(8 + i*0.2).toFixed(2)}s</td></tr>`;
                }

                let pos = 45;
                document.getElementById("rank-text").innerText = `Posición #${pos} de 150 Jugadores`;
                
                zoneTable.innerHTML += `<tr><td>${pos-2}</td><td>Carlos M.</td><td>${(myTime - 0.12).toFixed(2)}s</td></tr>`;
                zoneTable.innerHTML += `<tr><td>${pos-1}</td><td>Ana V.</td><td>${(myTime - 0.05).toFixed(2)}s</td></tr>`;
                zoneTable.innerHTML += `<tr class="rank-highlight"><td>${pos}</td><td>${state.formData.nombre} (TÚ)</td><td>${myTime}s</td></tr>`;
                zoneTable.innerHTML += `<tr><td>${pos+1}</td><td>Luis R.</td><td>${(parseFloat(myTime) + 0.11).toFixed(2)}s</td></tr>`;
                zoneTable.innerHTML += `<tr><td>${pos+2}</td><td>Maria F.</td><td>${(parseFloat(myTime) + 0.23).toFixed(2)}s</td></tr>`;
            }

            document.getElementById("btn-show-top15").onclick = () => document.getElementById("modal-top15").classList.remove("hidden");
            document.getElementById("btn-show-zone").onclick = () => document.getElementById("modal-zone").classList.remove("hidden");

        })();
    </script>
