<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desafío Jungle - Santander Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-color: #FF0000; 
            --dark-bg: rgba(10, 10, 10, 0.95);
            --bg-image: url('fondo.png'); 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            background-color: #000; background-image: var(--bg-image);
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .panel {
            background: var(--dark-bg);
            border: 4px solid var(--brand-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.1);
            padding: 35px 25px; width: 90%; max-width: 400px;
            text-align: center; position: relative;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); position: absolute; }

        h2 { color: var(--brand-color); font-size: 1.8rem; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; text-shadow: 2px 2px 0px #000; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { color: #fff; font-size: 0.9rem; margin-bottom: 5px; display: block; }

        input {
            width: 100%; padding: 15px; font-size: 1.1rem;
            background: #111; color: var(--brand-color);
            border: 2px solid #444; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            font-family: 'Montserrat', sans-serif; font-weight: bold; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: var(--brand-color); }
        #player-name { text-transform: capitalize; }

        button {
            width: 100%; padding: 18px; font-size: 1.4rem; font-weight: 900;
            background: var(--brand-color); color: #fff; 
            border: none; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            cursor: pointer; text-transform: uppercase; margin-top: 15px;
            box-shadow: 0 5px 0px #880000; transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(5px); box-shadow: 0 0px 0px #880000; }

        .btn-secondary {
            background: #111; color: var(--brand-color);
            border: 2px solid var(--brand-color);
            box-shadow: 0 5px 0px rgba(255, 0, 0, 0.3); margin-top: 25px;
        }
        .btn-secondary:active { box-shadow: 0 0px 0px rgba(255, 0, 0, 0.3); }

        .instruction-item { display: flex; align-items: center; text-align: left; margin-bottom: 20px; color: #fff; font-size: 1rem; }
        .instruction-icon { font-size: 2rem; margin-right: 15px; background: #222; border-radius: 50%; padding: 10px; border: 1px solid var(--brand-color); box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); }

        /* --- ESTILOS DEL JUEGO --- */
        .game-wrapper {
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            display: none; 
            z-index: 10;
            background-color: #000;
        }
        
        .base-img, .full-img, #reveal-canvas {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: contain; 
            pointer-events: none;
        }
        
        .full-img {
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Fade-in final de victoria */
            z-index: 3;
        }

        #reveal-canvas {
            z-index: 2;
        }
        .base-img {
            z-index: 1;
        }

        .big-text { font-size: 3.5rem; margin: 10px 0; font-weight: 900; color: var(--brand-color); }

        #countdown-text { font-size: 8rem; font-weight: 900; color: var(--brand-color); text-shadow: 5px 5px 0px #000; animation: pop 1s infinite; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div id="screen-form" class="overlay">
        <div class="panel">
            <h2>Ingresa tu nombre</h2>
            <div class="form-group">
                <input type="text" id="player-name" placeholder="Ej: Juan Pérez" autocomplete="name">
            </div>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <div id="screen-instructions" class="overlay hidden">
        <div class="panel">
            <h2>Cómo Jugar</h2>
            <div class="instruction-item">
                <div class="instruction-icon">📱</div>
                <div>Agita tu celular rápidamente para encender las luces.</div>
            </div>
            <button id="btn-start">¡LISTO, VAMOS!</button>
        </div>
    </div>

    <div id="screen-countdown" class="overlay hidden" style="background: rgba(0,0,0,0.9);">
        <div id="countdown-text">3</div>
    </div>

    <div id="screen-result" class="overlay hidden">
        <div class="panel">
            <h2>¡Arena Encendida!</h2>
            <p style="color: white; font-size:1.2rem; margin:0;">Tu tiempo fue:</p>
            <p class="big-text" id="final-time">0.00s</p>

            <div style="background: rgba(255, 0, 0, 0.1); border: 1px solid var(--brand-color); border-radius: 10px; padding: 15px; margin: 15px 0;">
                <p id="rank-text" style="color: var(--brand-color); font-size: 1.1rem; font-weight: bold; margin: 0;">Calculando tu posición...</p>
            </div>

            <button onclick="location.reload()">JUGAR DE NUEVO</button>
        </div>
    </div>

    <div id="game-container" class="game-wrapper">
        <img src="imagen1.png" class="base-img" alt="Oscura">
        <canvas id="reveal-canvas"></canvas>
        <img src="imagen2.png" id="full-image" class="full-img" alt="Iluminada">
    </div>

    <canvas id="confetti-canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        (function() {
            const CONFIG = Object.freeze({
                webhookUrl: "https://script.google.com/macros/s/AKfycbyViG0_MaktcyCywQJ1BMhx6arnVndR3qYK4gPiYU7X8lAwEs0ZfDnq5yvV7oEAI7qktg/exec", 
                targetBeats: 600, 
                threshold: 15,
                minTimePossible: 2.0,
                maxLights: 150 // Número total de luces que aparecerán 1 a 1 durante el juego
            });

            const AudioEngine = {
                ctx: null,
                init: function() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
                playTone: function(freq, type, duration, vol=0.1) {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                },
                beep: function() { this.playTone(440, 'square', 0.2, 0.1); }, 
                go: function() { this.playTone(880, 'square', 0.4, 0.2); },   
                tick: function() { this.playTone(600, 'sine', 0.05, 0.02); },  
                win: function() { 
                    this.playTone(440, 'sine', 0.5); 
                    setTimeout(() => this.playTone(554, 'sine', 0.5), 100); 
                    setTimeout(() => this.playTone(659, 'sine', 1.0), 200); 
                }
            };

            let state = { active: false, beats: 0, start: 0, name: "", lastBeatTime: 0 };
            
            // Array para almacenar cada destello individual
            let activeLights = []; 
            let animationFrameId = null;

            const ui = {
                screenForm: document.getElementById("screen-form"),
                screenInst: document.getElementById("screen-instructions"),
                screenCount: document.getElementById("screen-countdown"),
                screenResult: document.getElementById("screen-result"),
                gameContainer: document.getElementById("game-container"),
                fullImage: document.getElementById("full-image"),
                revealCanvas: document.getElementById("reveal-canvas"),
                finalTimeText: document.getElementById("final-time"),
                rankText: document.getElementById("rank-text"),
                nameInput: document.getElementById("player-name"),
                btnNext: document.getElementById("btn-next"),
                btnStart: document.getElementById("btn-start")
            };

            const ctx = ui.revealCanvas.getContext("2d");

            // Función ultra precisa para dibujar la imagen en el canvas (emulando object-fit: contain)
            function drawImageContain(ctx, img, w, h) {
                // Usamos naturalWidth para evitar que tome anchos CSS equivocados
                let imgRatio = img.naturalWidth / img.naturalHeight; 
                if (isNaN(imgRatio) || imgRatio === 0) return; // Protección si no ha cargado

                let canvasRatio = w / h;
                let drawW, drawH, drawX, drawY;

                if (imgRatio > canvasRatio) {
                    drawW = w;
                    drawH = w / imgRatio;
                    drawX = 0;
                    drawY = (h - drawH) / 2;
                } else {
                    drawW = h * imgRatio;
                    drawH = h;
                    drawX = (w - drawW) / 2;
                    drawY = 0;
                }
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            }

            ui.btnNext.onclick = () => {
                const name = ui.nameInput.value.trim();
                if(!name) return alert("Por favor, ingresa tu nombre.");
                state.name = name;
                ui.screenForm.classList.add("hidden");
                setTimeout(() => ui.screenInst.classList.remove("hidden"), 400);
            };

            ui.btnStart.onclick = async () => {
                AudioEngine.init();
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try { await DeviceMotionEvent.requestPermission(); } catch (e) { }
                }
                ui.screenInst.classList.add("hidden");
                setTimeout(startCountdown, 400);
            };

            function startCountdown() {
                ui.screenCount.classList.remove("hidden");
                let count = 3;
                document.getElementById("countdown-text").innerText = count;
                AudioEngine.beep();

                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        document.getElementById("countdown-text").innerText = count;
                        AudioEngine.beep();
                    } else if (count === 0) {
                        document.getElementById("countdown-text").innerText = "¡AGITA!";
                        document.getElementById("countdown-text").style.fontSize = "5rem";
                        AudioEngine.go();
                        if(navigator.vibrate) navigator.vibrate(500); 
                    } else {
                        clearInterval(interval);
                        ui.screenCount.classList.add("hidden");
                        ui.gameContainer.style.display = "block";
                        
                        // Pequeño retardo para asegurar que el navegador renderice el display:block
                        setTimeout(startGame, 50);
                    }
                }, 1000);
            }

            // BUCLE DE ANIMACIÓN PRINCIPAL (Responsable del Fade-In individual)
            function renderLoop() {
                if (!state.active && activeLights.length === 0) return;

                // Limpiar el fotograma
                ctx.clearRect(0, 0, ui.revealCanvas.width, ui.revealCanvas.height);

                // 1. Dibujar las "máscaras" de luz con sus respectivas opacidades
                ctx.globalCompositeOperation = 'source-over';
                
                activeLights.forEach(light => {
                    if (light.alpha < 1) {
                        light.alpha += 0.04; // Velocidad del fade in de CADA luz (~25 frames para ser visible)
                    }
                    
                    // Crear un gradiente radial (borde difuminado y suave, orgánico)
                    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.radius);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${light.alpha})`); // Centro brillante
                    grad.addColorStop(1, `rgba(255, 255, 255, 0)`); // Borde invisible
                    
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(light.x, light.y, light.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 2. Colorear esas máscaras con la imagen iluminada real
                ctx.globalCompositeOperation = 'source-in';
                drawImageContain(ctx, ui.fullImage, ui.revealCanvas.width, ui.revealCanvas.height);

                animationFrameId = requestAnimationFrame(renderLoop);
            }

            function startGame() {
                state.active = true; 
                state.start = Date.now(); 
                state.beats = 0;
                activeLights = [];
                
                // Usar window.innerWidth garantiza el tamaño exacto aunque display:none haya fallado antes
                ui.revealCanvas.width = window.innerWidth;
                ui.revealCanvas.height = window.innerHeight;
                ui.fullImage.style.opacity = 0;
                
                window.addEventListener("devicemotion", handleMotion);
                ui.gameContainer.addEventListener("click", handleTap); 
                
                // Iniciar el render engine
                animationFrameId = requestAnimationFrame(renderLoop);
            }

            const handleMotion = (e) => {
                if (!state.active) return;
                const acc = e.acceleration;
                const force = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
                if (force > CONFIG.threshold) addBeat(1);
            };

            const handleTap = () => {
                if (!state.active) return;
                const now = Date.now();
                if(now - state.lastBeatTime < 50) return; 
                state.lastBeatTime = now; 
                
                // Cada "toque" sumará el progreso equivalente a 2 luces directamente
                addBeat( (CONFIG.targetBeats / CONFIG.maxLights) * 2 ); 
            };

            const addBeat = (amount) => {
                state.beats += amount;

                // Calculamos cuántas luces deben existir en pantalla según el progreso total
                const progress = Math.min(state.beats / CONFIG.targetBeats, 1);
                const targetLightCount = Math.floor(progress * CONFIG.maxLights);

                // Si necesitamos más luces, las agregamos al array. ¡Nacen con opacidad 0!
                while (activeLights.length < targetLightCount) {
                    activeLights.push({
                        x: Math.random() * ui.revealCanvas.width,
                        y: Math.random() * ui.revealCanvas.height,
                        radius: Math.random() * 35 + 25, // Tamaño aleatorio orgánico
                        alpha: 0 // Inician invisibles para hacer el fade-in progresivo
                    });

                    // Pequeño feedback táctil/sonoro ocasional para no saturar
                    if (activeLights.length % 2 === 0) {
                        AudioEngine.tick();
                        if(navigator.vibrate) navigator.vibrate(10);
                    }
                }

                if (state.beats >= CONFIG.targetBeats) finish();
            };

            const finish = () => {
                if (!state.active) return;
                state.active = false; 
                
                const totalTime = ((Date.now() - state.start) / 1000).toFixed(2);
                if (totalTime < CONFIG.minTimePossible) {
                    alert("¡Demasiado rápido! Parece trampa.");
                    location.reload(); return;
                }

                // Damos 500ms para que las últimas luces que aparecieron terminen su animación de Fade-In...
                setTimeout(() => {
                    // ...Y luego encendemos la imagen completa de victoria (fade in css)
                    ui.fullImage.style.opacity = 1;
                    AudioEngine.win(); 
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]); 

                    // Esperamos que acabe la transición de victoria antes de tapar con los resultados
                    setTimeout(() => {
                        ui.finalTimeText.innerText = `${totalTime}s`;
                        ui.screenResult.classList.remove("hidden");
                        
                        const myConfetti = confetti.create(document.getElementById('confetti-canvas'), { resize: true });
                        myConfetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#FF0000', '#000000', '#ffffff'] });
                        
                        sendData(totalTime);
                    }, 1500);
                    
                }, 500);
            };

            const sendData = (time) => {
                const payload = { name: state.name, time: parseFloat(time), v: btoa(state.name + time) };
                fetch(CONFIG.webhookUrl, { method: "POST", body: JSON.stringify(payload) })
                .then(r => r.text())
                .then(text => {
                    try {
                        const data = JSON.parse(text);
                        if(data && data.posicion) ui.rankText.innerHTML = `Posición <br><span style="font-size: 2.2rem; color: #fff;">#${data.posicion}</span><br>de ${data.total}`;
                    } catch (e) { ui.rankText.innerHTML = `¡Tiempo registrado!`; }
                }).catch(() => ui.rankText.innerText = "¡Guardado localmente!");
            };
        })();
    </script>
</body>
</html>
