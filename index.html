<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafío Jungle</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-color:  #00b2ed; 
            --dark-bg: #011449;
            --text-glow: 0 0 15px #006ab9;
            --bg-image: url('fondo.png'); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; 
            font-family: 'Press Start 2P', cursive; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
            user-select: none; 
            background-color: #000; background-image: var(--bg-image);
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        #edge-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 90;
            box-shadow: inset 0 0 0px var(--dark-bg);
            transition: box-shadow 0.1s ease-out;
            will-change: box-shadow;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .panel {
            background: var(--dark-bg);
            border: 4px solid var(--brand-color);
            border-radius: 12px; 
            box-shadow: 0 0 15px #006ab9, inset 0 0 10px, #00b2ed;
            padding: 30px 20px; width: 90%; max-width: 400px;
            text-align: center; position: relative;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); position: absolute; }

        h2 { color: var(--brand-color); font-size: 1.1rem; line-height: 1.5; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; text-shadow: 2px 2px 0px #000; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { color: #fff; font-size: 0.7rem; margin-bottom: 10px; display: block; }

        input {
            width: 100%; padding: 15px; font-size: 0.8rem;
            background: #000000; color: var(--brand-color);
            border: 2px solid var(--brand-color); border-radius: 8px; 
            font-family: 'Press Start 2P', cursive; transition: border-color 0.3s;
        }
        input:focus { outline: none; box-shadow: 0 0 10px var(--brand-color); }
        #player-name { text-transform: capitalize; }

        button {
            width: 100%; padding: 18px; font-size: 0.9rem;
            background: var(--brand-color); color: #000;
            border: 2px solid var(--brand-color); border-radius: 8px; 
            cursor: pointer; text-transform: uppercase; margin-top: 15px;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 5px 0px #006ab9;; transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(5px); box-shadow: 0 0px 0px #006ab9;; }
        button:disabled { opacity: 0.7; cursor: not-allowed; transform: translateY(0); box-shadow: 0 5px 0px var(--dark-bg); }

        .btn-secondary {
            background: #020202; color: var(--brand-color);
            border: 2px solid var(--brand-color);
            box-shadow: 0 5px 0px #006ab9; margin-top: 25px;
        }

        .instruction-item { display: flex; align-items: center; text-align: left; margin-bottom: 20px; color: #fff; font-size: 0.7rem; line-height: 1.6; }
        .instruction-icon { font-size: 1.5rem; margin-right: 15px; background: #222; border-radius: 8px; padding: 10px; border: 1px solid var(--brand-color); box-shadow: 0 0 10px rgba(252, 238, 9, 0.3); }

        /* --- PROPORCIONES DE GUITARRA AMPLIADAS (+40%) --- */
        .logo-wrapper { 
            position: relative; 
            width: 100vw; 
            max-width: 630px; 
            height: 84vh; 
            margin-top: 0vh; 
            display: none; 
            z-index: 10; 
        }
        
        .silhouette-img {
            position: absolute; top: 20; left: 0; width: 100%; height: 100%;
            background-color: #000000; 
            -webkit-mask-image: url('logo.png');
            -webkit-mask-size: contain;
            -webkit-mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-image: url('logo.png');
            mask-size: contain;
            mask-position: center;
            mask-repeat: no-repeat;
            z-index: 1; 
        }

        .logo-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .full-color {
            z-index: 2; opacity: 1; 
            clip-path: inset(100% 0% 0% 0%); 
            -webkit-clip-path: inset(100% 0% 0% 0%);
            transform: translate3d(0,0,0);
        }

        .big-text { font-size: 1.5rem; margin: 15px 0; color: var(--brand-color); }

        #countdown-text { font-size: 5rem; color: var(--brand-color); text-shadow: 4px 4px 0px #000; animation: pop 1s infinite; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div id="edge-glow"></div>

    <div id="screen-form" class="overlay">
        <div class="panel">
            <h2>Ingresa tu nombre para jugar</h2>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="player-name" placeholder="Ej: Juan" autocomplete="name">
            </div>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <div id="screen-instructions" class="overlay hidden">
        <div class="panel">
            <h2>Cómo Jugar</h2>
            <div class="instruction-item">
                <div class="instruction-icon">📱</div>
                <div>Agita tu celular rápido para revelar la imagen.</div>
            </div>
            <div class="instruction-item">
                <div class="instruction-icon">⏱️</div>
                <div>El tiempo más rápido gana.</div>
            </div>
            <button id="btn-start">¡LISTO, VAMOS!</button>
        </div>
    </div>

    <div id="screen-countdown" class="overlay hidden" style="background: rgba(0,0,0,0.9);">
        <div id="countdown-text">3</div>
    </div>

    <div id="screen-result" class="overlay hidden">
        <div class="panel">
            <h2>¡Completado!</h2>
            <p style="color: white; font-size:0.9rem; margin:0;">Tu tiempo fue:</p>
            <p class="big-text" id="final-time">0.00s</p>
            <div style="background: rgba(0, 0, 0, 0.1); border: 1px solid var(--brand-color); border-radius: 8px; padding: 15px; margin: 15px 0;">
                <p id="rank-text" style="color: var(--brand-color); font-size: 0.8rem; line-height: 1.5; margin: 0;">Calculando posición...</p>
            </div>
            <button onclick="window.location.href='ranking.html'" class="btn-secondary">VER RANKING</button>
            <button onclick="location.reload()">REPETIR</button>
        </div>
    </div>

    <div id="game-container" class="logo-wrapper">
        <div class="silhouette-img"></div>
        <img src="logo.png" id="full-image" class="logo-img full-color" alt="Logo Relleno Color">
    </div>

    <canvas id="confetti-canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        (function() {
            const CONFIG = Object.freeze({
                webhookUrl: "https://script.google.com/macros/s/AKfycbyViG0_MaktcyCywQJ1BMhx6arnVndR3qYK4gPiYU7X8lAwEs0ZfDnq5yvV7oEAI7qktg/exec", 
                targetBeats: 1000, 
                threshold: 15,
                minTimePossible: 2.0 
            });

            const AudioEngine = {
                ctx: null, gainNode: null, guitarBuffer: null, guitarSource: null,
                
                init: async function() { 
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        this.ctx = new AudioContext();
                        this.gainNode = this.ctx.createGain();
                        this.gainNode.gain.value = 0; 
                        this.gainNode.connect(this.ctx.destination);
                        
                        try {
                            const response = await fetch('estadio.mp3'); 
                            const arrayBuffer = await response.arrayBuffer();
                            this.guitarBuffer = await new Promise((resolve, reject) => {
                                this.ctx.decodeAudioData(arrayBuffer, resolve, reject);
                            });
                        } catch (error) { console.error("Error cargando MP3:", error); }
                    }
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }
                },
                
                playTone: function(freq, type, duration, vol=0.1) {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                },
                
                beep: function() { this.playTone(440, 'square', 0.2, 0.1); }, 
                go: function() { this.playTone(880, 'square', 0.4, 0.2); },   
                
                startGuitar: function() {
                    if (!this.ctx || !this.guitarBuffer) return;
                    this.guitarSource = this.ctx.createBufferSource();
                    this.guitarSource.buffer = this.guitarBuffer;
                    this.guitarSource.loop = true; 
                    this.guitarSource.connect(this.gainNode);
                    this.guitarSource.start();
                },
                
                updateCrescendo: function(percentage, isShaking = true) {
                    if (this.gainNode && this.ctx) {
                        const targetVolume = isShaking ? Math.pow(percentage, 2) : 0; 
                        this.gainNode.gain.setTargetAtTime(targetVolume, this.ctx.currentTime, 0.15);
                    }
                },
                
                stopGuitar: function() {
                    if (this.guitarSource) {
                        try { this.guitarSource.stop(); } catch(e){}
                    }
                },
                
                win: function() { 
                    this.stopGuitar();
                    this.playTone(440, 'sine', 0.5); 
                    setTimeout(() => this.playTone(554, 'sine', 0.5), 100); 
                    setTimeout(() => this.playTone(659, 'sine', 1.0), 200); 
                }
            };

            let state = { active: false, beats: 0, progress: 0, start: 0, name: "", lastBeatTime: 0, isShaking: false, shakeTimeout: null };
            let animationPending = false;
            let hapticIntervalId = null;

            const ui = {
                screenForm: document.getElementById("screen-form"),
                screenInst: document.getElementById("screen-instructions"),
                screenCount: document.getElementById("screen-countdown"),
                screenResult: document.getElementById("screen-result"),
                gameContainer: document.getElementById("game-container"),
                fullImage: document.getElementById("full-image"),
                finalTimeText: document.getElementById("final-time"),
                rankText: document.getElementById("rank-text"),
                countText: document.getElementById("countdown-text"),
                nameInput: document.getElementById("player-name"),
                btnNext: document.getElementById("btn-next"),
                btnStart: document.getElementById("btn-start"),
                edgeGlow: document.getElementById("edge-glow") 
            };

            function syncOfflineData() {
                let pending = JSON.parse(localStorage.getItem("jungle_pending") || "[]");
                if (pending.length > 0) {
                    pending.forEach(p => fetch(CONFIG.webhookUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) }).catch(()=>{}));
                    localStorage.removeItem("jungle_pending");
                }
            }
            syncOfflineData();

            function switchScreen(hide, show) {
                hide.classList.add("hidden");
                setTimeout(() => show.classList.remove("hidden"), 400);
            }

            ui.btnNext.onclick = () => {
                const name = ui.nameInput.value.trim();
                if(!name) return alert("Por favor, ingresa tu nombre para jugar.");
                state.name = name;
                ui.btnNext.disabled = true;
                switchScreen(ui.screenForm, ui.screenInst);
            };

            ui.btnStart.onclick = async () => {
                ui.btnStart.disabled = true; 

                // 1. SOLICITUD DE SENSORES PRIMERO (Blindaje iOS)
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try { 
                        const permissionState = await DeviceMotionEvent.requestPermission();
                        if (permissionState !== 'granted') {
                            alert("Sensor desactivado. ¡Juega tocando la pantalla lo más rápido posible!");
                        }
                    } catch (e) {
                        alert("Acelerómetro no disponible. ¡Deberás tocar la pantalla rápido para ganar!");
                    }
                }

                // 2. INICIAR AUDIO DESPUÉS
                try {
                    await AudioEngine.init();
                } catch(e) {
                    console.error("Audio retrasado", e);
                }

                ui.screenInst.classList.add("hidden");
                setTimeout(startCountdown, 400);
            };

            function startCountdown() {
                ui.screenCount.classList.remove("hidden");
                let count = 3;
                ui.countText.innerText = count;
                AudioEngine.beep();

                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        ui.countText.innerText = count;
                        AudioEngine.beep();
                    } else if (count === 0) {
                        ui.countText.innerText = "¡AGITA!";
                        ui.countText.style.fontSize = "2.5rem";
                        AudioEngine.go();
                        if(navigator.vibrate) navigator.vibrate(500); 
                    } else {
                        clearInterval(interval);
                        ui.screenCount.classList.add("hidden");
                        ui.gameContainer.style.display = "block";
                        startGame();
                    }
                }, 1000);
            }

            function startGame() {
                state.active = true; state.start = Date.now(); state.beats = 0; state.progress = 0; state.isShaking = false;
                
                ui.fullImage.style.clipPath = `inset(100% 0% 0% 0%)`;
                ui.fullImage.style.webkitClipPath = `inset(100% 0% 0% 0%)`;

                AudioEngine.startGuitar();
                AudioEngine.updateCrescendo(0, false);

                if(navigator.vibrate) {
                    hapticIntervalId = setInterval(() => {
                        if(state.active && state.isShaking) {
                            let vibDuration = Math.floor(5 + (state.progress * 40));
                            navigator.vibrate(vibDuration);
                        }
                    }, 250); 
                }

                window.addEventListener("devicemotion", handleMotion, true);
                ui.gameContainer.addEventListener("touchstart", handleTap, {passive: false});
                ui.gameContainer.addEventListener("click", handleTap);
            }

            const handleMotion = (e) => {
                if (!state.active) return;
                let acc = e.acceleration || e.accelerationIncludingGravity; 
                if(!acc) return;

                const force = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
                if (force > CONFIG.threshold) addBeat(1);
            };

            const handleTap = (e) => {
                if(e && e.cancelable) e.preventDefault(); 
                if (!state.active) return;
                const now = Date.now();
                if(now - state.lastBeatTime < 50) return; 
                state.lastBeatTime = now; addBeat(5); 
            };

            const addBeat = (amount) => {
                state.beats += amount;

                state.isShaking = true;
                if (state.shakeTimeout) clearTimeout(state.shakeTimeout);

                state.progress = Math.min(state.beats / CONFIG.targetBeats, 1.0);
                const clip = Math.max(0, 100 - (state.progress * 100));

                if (!animationPending) {
                    animationPending = true;
                    requestAnimationFrame(() => {
                        ui.fullImage.style.clipPath = `inset(${clip}% 0% 0% 0%)`;
                        ui.fullImage.style.webkitClipPath = `inset(${clip}% 0% 0% 0%)`;
                        
                        void ui.fullImage.offsetHeight; 
                        
                        let glowSpread = state.progress * 120; 
                        let glowAlpha = state.progress * 0.8;  
                        ui.edgeGlow.style.boxShadow = `inset 0 0 ${glowSpread}px rgba(255, 0, 0, ${glowAlpha})`;

                        animationPending = false;
                    });
                }

                AudioEngine.updateCrescendo(state.progress, true);

                state.shakeTimeout = setTimeout(() => {
                    if (state.active) {
                        state.isShaking = false;
                        AudioEngine.updateCrescendo(state.progress, false); 
                    }
                }, 300);

                if (state.beats >= CONFIG.targetBeats) finish();
            };

            const finish = () => {
                if (!state.active) return;
                state.active = false;
                const totalTime = ((Date.now() - state.start) / 1000).toFixed(2);

                if (totalTime < CONFIG.minTimePossible) {
                    alert("¡Demasiado rápido! Parece un error o trampa.");
                    location.reload(); return;
                }

                if (hapticIntervalId) clearInterval(hapticIntervalId);
                if (state.shakeTimeout) clearTimeout(state.shakeTimeout);
                
                ui.edgeGlow.style.boxShadow = `inset 0 0 0px rgba(255, 0, 0, 0)`;

                AudioEngine.win(); 
                if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]); 

                ui.finalTimeText.innerText = `${totalTime}s`;
                ui.screenResult.classList.remove("hidden");
                launchConfetti(); 
                sendData(totalTime);
            };

            const sendData = (time) => {
                const payload = { name: state.name, time: parseFloat(time), v: btoa(state.name + time) };

                fetch(CONFIG.webhookUrl, {
                    method: "POST", 
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify(payload)
                })
                .then(r => r.text()) 
                .then(text => {
                    ui.rankText.style.animation = "none";
                    try {
                        const data = JSON.parse(text);
                        if(data && data.posicion) {
                            ui.rankText.innerHTML = `¡Quedaste en<br>la posición<br><span style="font-size: 1.5rem; color: #fff;">#${data.posicion}</span><br>de ${data.total}!`;
                        } else {
                            ui.rankText.innerHTML = `¡Tiempo registrado exitosamente!`;
                        }
                    } catch (e) {
                        ui.rankText.innerHTML = `¡Tiempo registrado!`;
                    }
                })
                .catch(() => {
                    let pending = JSON.parse(localStorage.getItem("jungle_pending") || "[]");
                    pending.push(payload);
                    localStorage.setItem("jungle_pending", JSON.stringify(pending));

                    ui.rankText.style.animation = "none";
                    ui.rankText.innerText = "¡Tiempo guardado localmente! Se sincronizará pronto.";
                });
            };

            const launchConfetti = () => {
                const myConfetti = confetti.create(document.getElementById('confetti-canvas'), { resize: true });
                myConfetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#FCEE09', '#000000', '#ffffff'] });
            };
        })();
    </script>
</body>
</html>
